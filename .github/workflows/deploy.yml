name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy via FTPS Explicit (Port 21)
        id: deploy_ftps_explicit
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        continue-on-error: true
        with:
          server: ${{ secrets.BE_FTP_SERVER }}
          username: ${{ secrets.BE_FTP_USERNAME }}
          password: ${{ secrets.BE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          log-level: verbose
          security: loose
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/*.bat
            **/tests/**

      - name: Deploy via FTPS Implicit (Port 990 fallback)
        id: deploy_ftps_implicit
        if: steps.deploy_ftps_explicit.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        continue-on-error: true
        with:
          server: ${{ secrets.BE_FTP_SERVER }}
          username: ${{ secrets.BE_FTP_USERNAME }}
          password: ${{ secrets.BE_FTP_PASSWORD }}
          protocol: ftps-legacy
          port: 990
          timeout: 120000
          log-level: verbose
          security: loose
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/*.bat
            **/tests/**

      - name: Fail if all deploy attempts fail
        if: steps.deploy_ftps_explicit.outcome == 'failure' && steps.deploy_ftps_implicit.outcome == 'failure'
        run: |
          echo "Both FTPS explicit (21) and FTPS implicit (990) failed."
          echo "Likely causes: server blocks GitHub runner IPs, wrong host/port, or server only supports SFTP."
          exit 1
      
