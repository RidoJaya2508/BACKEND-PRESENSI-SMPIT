name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connectivity check to FTP ports
        run: |
          echo "Checking FTP host reachability from GitHub runner..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.BE_FTP_SERVER }}/21" && echo "Port 21 reachable" || echo "Port 21 not reachable"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.BE_FTP_SERVER }}/990" && echo "Port 990 reachable" || echo "Port 990 not reachable"
      
      - name: Deploy via FTP (Port 21)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.BE_FTP_SERVER }}
          username: ${{ secrets.BE_FTP_USERNAME }}
          password: ${{ secrets.BE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          log-level: verbose
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/*.bat
            **/tests/**
      
